version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
formatters:
  enable:
    - gofmt
    - goimports
linters-settings:
  errcheck:
    exclude-functions:
      - (*log/slog.Logger).Debug
      - (fmt.Fprint*)
      - (fmt.Print*)
      - (fmt.Println)
issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]
  max-issues-per-linter: 0
  max-same-issues: 0
