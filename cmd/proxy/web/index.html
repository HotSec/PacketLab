<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacketLab — HTTP/HTTPS Traffic Capture</title>
<style>
/* ===== Theme Variables ===== */
:root,[data-theme="dark"]{
--bg-root:#0d1117;--bg-surface:#161b22;--bg-elevated:#1c2129;--bg-hover:#212731;
--bg-active:#262c36;--bg-input:#0f1319;--border-default:#30363d;--border-subtle:#21262d;
--border-accent:rgba(232,145,58,0.30);--text-primary:#e6edf3;--text-secondary:#8b949e;
--text-tertiary:#6e7681;--accent:#e8913a;--accent-hover:#f0a254;--accent-muted:rgba(232,145,58,0.12);
--green:#3fb950;--green-muted:rgba(63,185,80,0.12);--red:#f85149;--red-muted:rgba(248,81,73,0.12);
--blue:#58a6ff;--blue-muted:rgba(88,166,255,0.12);--yellow:#d2991d;--yellow-muted:rgba(210,153,29,0.12);
--purple:#bc8cff;--purple-muted:rgba(188,140,255,0.12);--cyan:#39d2c0;
}
[data-theme="light"]{
--bg-root:#ffffff;--bg-surface:#f6f8fa;--bg-elevated:#ffffff;--bg-hover:#f0f2f5;
--bg-active:#e8eaed;--bg-input:#f6f8fa;--border-default:#d0d7de;--border-subtle:#d8dee4;
--border-accent:rgba(232,145,58,0.25);--text-primary:#1f2328;--text-secondary:#656d76;
--text-tertiary:#8b949e;--accent:#d9773e;--accent-hover:#c4652f;--accent-muted:rgba(217,119,62,0.1);
--green:#1a7f37;--green-muted:rgba(26,127,55,0.1);--red:#cf222e;--red-muted:rgba(207,34,46,0.1);
--blue:#0969da;--blue-muted:rgba(9,105,218,0.1);--yellow:#9a6700;--yellow-muted:rgba(154,103,0,0.1);
--purple:#8250df;--purple-muted:rgba(130,80,223,0.1);--cyan:#1b7c83;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Geist","Satoshi",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg-root);color:var(--text-primary);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
:root{--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;--font-mono:"JetBrains Mono","Cascadia Code","Fira Code","SF Mono","Menlo","Consolas",monospace}
.app{display:flex;flex-direction:column;height:100%;min-height:100dvh}
/* Topbar */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);min-height:48px;flex-shrink:0;z-index:10;flex-wrap:wrap}
.logo-area{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-icon{width:30px;height:30px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--accent),#d9773e);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;font-family:var(--font-mono)}
.logo-text{font-weight:650;font-size:14px;letter-spacing:-0.02em}
.capture-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:18px;font-size:12px;font-weight:550;cursor:pointer;border:1px solid var(--border-default);background:var(--bg-elevated);color:var(--text-primary);transition:all .15s;white-space:nowrap;flex-shrink:0}
.capture-btn:hover{background:var(--bg-hover)}
.capture-btn.recording{background:var(--red-muted);border-color:var(--red);color:var(--red)}
.capture-dot{width:7px;height:7px;border-radius:50%;background:var(--text-tertiary);transition:all .15s}
.capture-btn.recording .capture-dot{background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse-dot 1.2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.divider-v{width:1px;height:18px;background:var(--border-subtle);flex-shrink:0}
.search-wrap{position:relative;flex:1;min-width:100px;max-width:350px}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-tertiary)}
.search-input{width:100%;padding:5px 10px 5px 30px;border-radius:18px;border:1px solid var(--border-subtle);background:var(--bg-input);color:var(--text-primary);font-size:12px;outline:none;transition:all .15s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-muted)}
.topbar-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text-secondary);cursor:pointer;transition:all .15s;position:relative;font-size:11px}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.icon-btn:active{transform:scale(.95)}
.icon-btn.active{color:var(--accent)}
/* Main */
.main-content{display:flex;flex:1;overflow:hidden;position:relative}
.request-panel{width:390px;min-width:260px;display:flex;flex-direction:column;background:var(--bg-surface);border-right:1px solid var(--border-subtle);flex-shrink:0;transition:width .25s}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border-subtle);flex-shrink:0}
.panel-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)}
.panel-count{font-size:10px;color:var(--text-tertiary);font-family:var(--font-mono)}
.filter-chips{display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid var(--border-subtle);flex-shrink:0;overflow-x:auto}
.filter-chip{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:550;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.filter-chip:hover{border-color:var(--text-tertiary);color:var(--text-primary)}
.filter-chip.active{border-color:var(--accent);background:var(--accent-muted);color:var(--accent)}
.request-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0}
.request-list::-webkit-scrollbar{width:5px}
.request-list::-webkit-scrollbar-track{background:transparent}
.request-list::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:10px}
.request-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.request-item:hover{background:var(--bg-hover)}
.request-item.active{background:var(--bg-active);border-left-color:var(--accent)}
.method-badge{min-width:48px;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:700;text-align:center;font-family:var(--font-mono);letter-spacing:.03em;flex-shrink:0}
.method-GET{background:var(--green-muted);color:var(--green)}
.method-POST{background:var(--blue-muted);color:var(--blue)}
.method-PUT{background:var(--yellow-muted);color:var(--yellow)}
.method-PATCH{background:var(--purple-muted);color:var(--purple)}
.method-DELETE{background:var(--red-muted);color:var(--red)}
.method-HEAD,.method-OPTIONS{background:rgba(139,148,158,.12);color:var(--text-secondary)}
.method-CONNECT{background:var(--blue-muted);color:var(--blue)}
.status-code{min-width:36px;font-size:10px;font-weight:600;font-family:var(--font-mono);flex-shrink:0;text-align:center}
.status-2xx{color:var(--green)}.status-3xx{color:var(--blue)}.status-4xx{color:var(--yellow)}.status-5xx{color:var(--red)}
.request-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.request-url{font-size:12px;font-family:var(--font-mono);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.request-meta{display:flex;gap:8px;font-size:10px;color:var(--text-tertiary)}
.request-arrow{flex-shrink:0;color:var(--text-tertiary);opacity:0;transition:all .15s}
.request-item:hover .request-arrow,.request-item.active .request-arrow{opacity:1}
.resize-handle{width:4px;cursor:col-resize;background:transparent;flex-shrink:0;transition:background .15s;position:relative;z-index:5}
.resize-handle:hover,.resize-handle.dragging{background:var(--accent)}
.detail-panel{flex:1;display:flex;flex-direction:column;background:var(--bg-root);overflow:hidden;min-width:0}
.detail-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-tertiary)}
.detail-empty-icon{width:64px;height:64px;border-radius:50%;background:var(--bg-surface);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary)}
.detail-empty-title{font-size:14px;font-weight:550;color:var(--text-secondary)}
.detail-empty-sub{font-size:12px;max-width:280px;text-align:center}
.detail-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.detail-tabs{display:flex;gap:0;border-bottom:1px solid var(--border-subtle);flex-shrink:0;background:var(--bg-surface);padding:0 14px;overflow-x:auto}
.detail-tab{padding:8px 14px;font-size:12px;font-weight:550;color:var(--text-secondary);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.detail-tab:hover{color:var(--text-primary)}
.detail-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.detail-body{flex:1;overflow-y:auto}
.detail-body::-webkit-scrollbar{width:6px}
.detail-body::-webkit-scrollbar-track{background:transparent}
.detail-body::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:10px}
.tab-panel{display:none;padding:14px}
.tab-panel.active{display:block}
.detail-section{margin-bottom:16px}.detail-section:last-child{margin-bottom:0}
.section-label{font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--text-tertiary);margin-bottom:6px}
.kv-row{display:flex;align-items:flex-start;padding:4px 8px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:12px;transition:background .15s}
.kv-row:hover{background:var(--bg-hover)}
.kv-key{color:var(--blue);min-width:140px;flex-shrink:0;padding-right:10px}
.kv-value{color:var(--text-primary);word-break:break-all}
.code-block{background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.code-block-header{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle)}
.code-block-lang{font-size:10px;color:var(--text-tertiary);font-family:var(--font-mono)}
.code-block-actions{display:flex;gap:3px}
.code-block pre{padding:12px 14px;margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.6;overflow-x:auto;color:var(--text-primary);max-height:350px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.mini-btn{padding:3px 8px;border-radius:var(--radius-sm);font-size:10px;font-weight:550;cursor:pointer;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-secondary);transition:all .15s}
.mini-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.mini-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.mini-btn.primary:hover{background:var(--accent-hover)}
/* Resend */
.resend-url-row{display:flex;gap:6px;margin-bottom:12px}
.method-select{padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-input);color:var(--accent);font-family:var(--font-mono);font-size:12px;font-weight:700;outline:none;cursor:pointer;min-width:90px;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238b949e' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;padding-right:24px}
.url-input{flex:1;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-input);color:var(--text-primary);font-family:var(--font-mono);font-size:12px;outline:none;transition:border .15s}
.url-input:focus{border-color:var(--accent)}
.kv-editor{margin-bottom:12px}
.kv-editor-row{display:flex;gap:6px;margin-bottom:4px;align-items:center}
.kv-editor-row input{flex:1;padding:5px 8px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);background:var(--bg-input);color:var(--text-primary);font-family:var(--font-mono);font-size:11px;outline:none;transition:border .15s}
.kv-editor-row input:focus{border-color:var(--accent)}
.kv-remove-btn{width:24px;height:24px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text-tertiary);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.kv-remove-btn:hover{background:var(--red-muted);color:var(--red)}
.body-textarea{width:100%;min-height:140px;padding:10px;border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--bg-input);color:var(--text-primary);font-family:var(--font-mono);font-size:12px;line-height:1.6;outline:none;resize:vertical;transition:border .15s;tab-size:2}
.body-textarea:focus{border-color:var(--accent)}
.send-btn{width:100%;padding:8px 14px;border-radius:var(--radius-md);font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--accent);color:#fff;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.send-btn:hover{background:var(--accent-hover);box-shadow:0 4px 12px rgba(232,145,58,.25)}
.send-btn:active{transform:scale(.98)}
.send-btn.sending{background:var(--bg-elevated);color:var(--text-secondary);cursor:wait;pointer-events:none}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
/* API Map */
.api-map-host-select{margin-bottom:12px;display:flex;gap:6px;align-items:center}
.api-map-host-select select{flex:1;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-input);color:var(--text-primary);font-size:12px;outline:none;font-family:var(--font-mono)}
.api-map-tree{padding:0}
.tree-node{padding-left:0;user-select:none}
.tree-node-header{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;font-size:12px}
.tree-node-header:hover{background:var(--bg-hover)}
.tree-node-toggle{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-tertiary);transition:transform .15s}
.tree-node-toggle.open{transform:rotate(90deg)}
.tree-node-icon{flex-shrink:0;color:var(--text-tertiary)}
.tree-node-name{font-family:var(--font-mono);color:var(--text-primary);font-weight:550}
.tree-node-count{font-size:10px;color:var(--text-tertiary);margin-left:4px}
.tree-node-children{padding-left:20px;overflow:hidden;transition:max-height .2s}
.tree-node-methods{display:flex;flex-wrap:wrap;gap:3px;margin-left:auto}
.tree-method-tag{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;font-family:var(--font-mono)}
.tree-leaf{padding-left:20px}
.tree-leaf-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;font-size:11px;transition:background .15s}
.tree-leaf-row:hover{background:var(--bg-hover)}
.tree-leaf-method{font-family:var(--font-mono);font-weight:600;flex-shrink:0;min-width:50px;font-size:10px}
.tree-leaf-path{font-family:var(--font-mono);color:var(--text-primary)}
.tree-leaf-status{font-size:9px;margin-left:auto;display:flex;gap:3px}
.tree-leaf-status span{padding:0 3px;border-radius:3px}
.tree-leaf-note{font-size:10px;color:var(--accent);margin-left:6px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.note-editor{display:flex;gap:4px;margin-top:4px;padding-left:24px}
.note-editor input{flex:1;padding:4px 8px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);background:var(--bg-input);color:var(--text-primary);font-size:11px;outline:none}
.note-editor input:focus{border-color:var(--accent)}
/* Status bar */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:3px 14px;background:var(--bg-surface);border-top:1px solid var(--border-subtle);font-size:10px;color:var(--text-tertiary);flex-shrink:0;min-height:26px;font-family:var(--font-mono)}
.statusbar-left,.statusbar-right{display:flex;align-items:center;gap:14px}
.status-indicator{display:flex;align-items:center;gap:4px}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--text-tertiary)}
.status-dot.recording{background:var(--green);box-shadow:0 0 5px var(--green)}
/* Toast */
.toast-container{position:fixed;bottom:36px;right:18px;z-index:100;display:flex;flex-direction:column;gap:6px}
.toast{padding:8px 14px;border-radius:var(--radius-md);background:var(--bg-elevated);border:1px solid var(--border-default);color:var(--text-primary);font-size:12px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:toast-in .25s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:6px}
.toast.success{border-color:var(--green)}.toast.error{border-color:var(--red)}
@keyframes toast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* Skeleton */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{background:linear-gradient(90deg,var(--bg-elevated) 25%,var(--bg-hover) 50%,var(--bg-elevated) 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:var(--radius-sm)}
@media(max-width:768px){.request-panel{width:100%!important}.detail-panel{display:none}.detail-panel.show-mobile{display:flex;position:absolute;inset:0;z-index:20}}
</style>
</head>
<body>

<div class="app">
<header class="topbar">
<div class="logo-area"><div class="logo-icon">PL</div><span class="logo-text">PacketLab</span></div>
<button class="capture-btn recording" id="captureBtn" onclick="toggleCapture()"><span class="capture-dot"></span><span id="captureLabel" data-i18n="recording">录制中</span></button>
<div class="divider-v"></div>
<div class="search-wrap">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
<input type="text" class="search-input" data-i18n-placeholder="filter_placeholder" placeholder="过滤 URL / 状态码 / 方法..." id="searchInput" oninput="filterRequests()">
</div>
<div class="topbar-actions">
<button class="icon-btn" data-i18n-title="theme_toggle" title="切换主题" onclick="toggleTheme()" id="themeBtn">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>
<button class="icon-btn" data-i18n-title="lang_toggle" title="English" onclick="toggleLang()" id="langBtn">EN</button>
<button class="icon-btn" data-i18n-title="error_filter" title="仅显示错误" onclick="toggleErrorFilter()" id="errorFilterBtn">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
</button>
<button class="icon-btn" data-i18n-title="clear_history" title="清空记录" onclick="clearHistory()">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
</button>
</div>
</header>

<div class="main-content">
<aside class="request-panel" id="requestPanel">
<div class="panel-header"><span class="panel-title" data-i18n="request_list">请求列表</span><span class="panel-count" id="requestCount">0</span></div>
<div class="filter-chips">
<button class="filter-chip active" data-filter="all" onclick="setFilter(this,'all')" data-i18n="filter_all">全部</button>
<button class="filter-chip" data-filter="GET" onclick="setFilter(this,'GET')">GET</button>
<button class="filter-chip" data-filter="POST" onclick="setFilter(this,'POST')">POST</button>
<button class="filter-chip" data-filter="PUT" onclick="setFilter(this,'PUT')">PUT</button>
<button class="filter-chip" data-filter="DELETE" onclick="setFilter(this,'DELETE')">DELETE</button>
</div>
<div class="request-list" id="requestList"></div>
</aside>
<div class="resize-handle" id="resizeHandle"></div>
<section class="detail-panel" id="detailPanel">
<div class="detail-empty" id="detailEmpty">
<div class="detail-empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
<div class="detail-empty-title" data-i18n="select_request">选择一个请求查看详情</div>
<div class="detail-empty-sub" data-i18n="select_request_hint">从左侧请求列表点击任意条目，即可查看请求/响应详情、编辑并重发</div>
</div>
<div class="detail-content" id="detailContent" style="display:none">
<div class="detail-tabs">
<button class="detail-tab active" data-tab="request" onclick="switchTab('request')" data-i18n="tab_request">请求</button>
<button class="detail-tab" data-tab="response" onclick="switchTab('response')" data-i18n="tab_response">响应</button>
<button class="detail-tab" data-tab="resend" onclick="switchTab('resend')" data-i18n="tab_resend">重发</button>
<button class="detail-tab" data-tab="apimap" onclick="switchTab('apimap')" data-i18n="tab_apimap">API地图</button>
</div>
<div class="detail-body">
<div class="tab-panel active" id="tab-request">
<div class="detail-section"><div class="section-label" data-i18n="overview">概要</div>
<div class="kv-row"><span class="kv-key">URL</span><span class="kv-value" id="req-url"></span></div>
<div class="kv-row"><span class="kv-key">Method</span><span class="kv-value" id="req-method"></span></div>
<div class="kv-row"><span class="kv-key">Host</span><span class="kv-value" id="req-host"></span></div>
<div class="kv-row"><span class="kv-key">Protocol</span><span class="kv-value" id="req-protocol"></span></div></div>
<div class="detail-section"><div class="section-label" data-i18n="req_headers">请求头</div>
<div id="req-headers" class="code-block"><div class="code-block-header"><span class="code-block-lang">Headers</span><button class="mini-btn" onclick="copyToClipboard('req-headers')" data-i18n="copy">复制</button></div><pre id="req-headers-content"></pre></div></div>
<div class="detail-section"><div class="section-label" data-i18n="req_body">请求体</div>
<div id="req-body-wrap" class="code-block"><div class="code-block-header"><span class="code-block-lang">Body</span><button class="mini-btn" onclick="copyToClipboard('req-body-wrap')" data-i18n="copy">复制</button></div><pre id="req-body-content"></pre></div></div>
</div>
<div class="tab-panel" id="tab-response">
<div class="detail-section"><div class="section-label" data-i18n="overview">概要</div>
<div class="kv-row"><span class="kv-key">Status</span><span class="kv-value" id="res-status"></span></div>
<div class="kv-row"><span class="kv-key">Time</span><span class="kv-value" id="res-time"></span></div>
<div class="kv-row"><span class="kv-key">Size</span><span class="kv-value" id="res-size"></span></div></div>
<div class="detail-section"><div class="section-label" data-i18n="res_headers">响应头</div>
<div id="res-headers" class="code-block"><div class="code-block-header"><span class="code-block-lang">Headers</span><button class="mini-btn" onclick="copyToClipboard('res-headers')" data-i18n="copy">复制</button></div><pre id="res-headers-content"></pre></div></div>
<div class="detail-section"><div class="section-label" data-i18n="res_body">响应体</div>
<div id="res-body-wrap" class="code-block"><div class="code-block-header"><span class="code-block-lang">Body</span><button class="mini-btn" onclick="copyToClipboard('res-body-wrap')" data-i18n="copy">复制</button></div><pre id="res-body-content"></pre></div></div>
</div>
<div class="tab-panel" id="tab-resend">
<div class="detail-section"><div class="section-label" data-i18n="edit_request">编辑请求</div>
<div class="resend-url-row">
<select class="method-select" id="resendMethod"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select>
<input type="text" class="url-input" id="resendUrl" placeholder="https://api.example.com/endpoint">
<button class="mini-btn primary" onclick="sendResend()" id="resendBtn">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
<span data-i18n="send">发送</span></button></div>
<div class="section-label" data-i18n="req_headers_mini">请求头</div>
<div class="kv-editor" id="resendHeaders"></div>
<button class="mini-btn" onclick="addHeaderRow()" style="margin-bottom:12px" data-i18n="add_header">+ 添加 Header</button>
<div class="section-label" data-i18n="req_body">请求体</div>
<textarea class="body-textarea" id="resendBody" placeholder='{"key":"value"}' spellcheck="false"></textarea></div>
</div>
<div class="tab-panel" id="tab-apimap">
<div class="detail-section"><div class="section-label" data-i18n="api_map">API 地图</div>
<div class="api-map-host-select">
<select id="apimapHostSelect" onchange="loadAPIMap()"><option value="" data-i18n="select_host">选择站点...</option></select>
<button class="mini-btn primary" onclick="loadAPIMap()" data-i18n="refresh">刷新</button></div>
<div class="api-map-tree" id="apimapTree"></div></div>
</div>
</div></div></section></div>
<footer class="statusbar"><div class="statusbar-left"><div class="status-indicator"><span class="status-dot recording" id="statusDot"></span><span id="statusText" data-i18n="recording">录制中</span></div><span id="totalRequests">0</span><span id="totalSize">0 KB</span></div><div class="statusbar-right"><span id="errorCount">0</span><span>PacketLab v2.0</span></div></footer></div>
<div class="toast-container" id="toastContainer"></div>

<script>
// =============================================
// i18n
// =============================================
const LOCALE={
zh:{recording:"录制中",paused:"已暂停",request_list:"请求列表",filter_all:"全部",
filter_placeholder:"过滤 URL / 状态码 / 方法...",select_request:"选择一个请求查看详情",
select_request_hint:"从左侧请求列表点击任意条目，即可查看请求/响应详情、编辑并重发",
tab_request:"请求",tab_response:"响应",tab_resend:"重发",tab_apimap:"API地图",
overview:"概要",req_headers:"请求头",req_body:"请求体",res_headers:"响应头",res_body:"响应体",
edit_request:"编辑请求",req_headers_mini:"请求头",add_header:"+ 添加 Header",send:"发送",
copy:"复制",api_map:"API 地图",select_host:"选择站点...",refresh:"刷新",no_requests:"暂无匹配的请求",
theme_toggle:"切换主题",lang_toggle:"切换语言",error_filter:"仅显示错误",clear_history:"清空记录",
confirm_clear:"确定要清空所有捕获记录？此操作不可撤销。",cleared:"记录已清空",copied:"已复制到剪贴板",
sent:"请求已发送",send_failed:"发送失败",recordings:"条记录",requests:"请求",errors:"错误",empty:"(empty)"},
en:{recording:"Recording",paused:"Paused",request_list:"Requests",filter_all:"All",
filter_placeholder:"Filter URL / Status / Method...",select_request:"Select a request to inspect",
select_request_hint:"Click any entry from the request list to view request/response details, edit and resend",
tab_request:"Request",tab_response:"Response",tab_resend:"Resend",tab_apimap:"API Map",
overview:"Overview",req_headers:"Request Headers",req_body:"Request Body",res_headers:"Response Headers",
res_body:"Response Body",edit_request:"Edit Request",req_headers_mini:"Headers",add_header:"+ Add Header",
send:"Send",copy:"Copy",api_map:"API Map",select_host:"Select host...",refresh:"Refresh",
no_requests:"No matching requests",theme_toggle:"Toggle theme",lang_toggle:"Switch language",
error_filter:"Errors only",clear_history:"Clear history",
confirm_clear:"Clear all captured requests? This cannot be undone.",cleared:"History cleared",
copied:"Copied to clipboard",sent:"Request sent",send_failed:"Send failed",
recordings:"records",requests:"requests",errors:"errors",empty:"(empty)"}};
let lang=localStorage.getItem('packetlab_lang')||'zh';
function t(key){return (LOCALE[lang]&&LOCALE[lang][key])||(LOCALE.en&&LOCALE.en[key])||key}
function applyLang(){lang=localStorage.getItem('packetlab_lang')||'zh';document.documentElement.lang=lang==='zh'?'zh-CN':'en';
document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(el.tagName==='INPUT'&&el.hasAttribute('placeholder')){const pk=el.dataset.i18nPlaceholder||k;el.placeholder=t(pk)}else{el.textContent=t(k)}});
document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.dataset.i18nTitle)});
document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder)});
document.getElementById('langBtn').textContent=lang==='zh'?'EN':'中文'}
function toggleLang(){lang=lang==='zh'?'en':'zh';localStorage.setItem('packetlab_lang',lang);applyLang()}

// =============================================
// Theme
// =============================================
let theme=localStorage.getItem('packetlab_theme')||'dark';
function applyTheme(){document.documentElement.setAttribute('data-theme',theme)}
function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('packetlab_theme',theme);applyTheme()}
applyTheme();

// =============================================
// State
// =============================================
const API_BASE='';let requests=[],requestDetailCache={},selectedRequestId=null,activeTab='request';
let currentFilter='all',errorFilterOnly=false,isRecording=true,ws=null,wsReconnectTimer=null;
async function apiGet(p){const r=await fetch(API_BASE+p);if(!r.ok)throw Error(`API ${r.status}`);return r.json()}
async function apiPost(p,b){const r=await fetch(API_BASE+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error(`API ${r.status}`);return r.json()}
async function apiDelete(p){const r=await fetch(API_BASE+p,{method:'DELETE'});if(!r.ok)throw Error(`API ${r.status}`);return r.json()}

// =============================================
// Data
// =============================================
async function loadRequests(){try{const p=new URLSearchParams();if(currentFilter!=='all')p.set('method',currentFilter);if(errorFilterOnly)p.set('error_only','true');const s=document.getElementById('searchInput').value.trim();if(s)p.set('search',s);p.set('limit','200');const r=await apiGet('/api/requests?'+p.toString());requests=(r.data||[]).map(n);renderRequestList()}catch(e){console.error(e)}}
async function loadRequestDetail(id){if(requestDetailCache[id])return requestDetailCache[id];try{const d=await apiGet('/api/requests/'+id);requestDetailCache[id]=d;return d}catch(e){return null}}
async function loadStats(){try{const s=await apiGet('/api/stats');document.getElementById('totalRequests').textContent=`${s.total||0} ${t('requests')}`;document.getElementById('totalSize').textContent=f(s.total_size||0);document.getElementById('errorCount').textContent=`${s.errors||0} ${t('errors')}`}catch(e){}}
function n(r){return{id:r.id,method:r.method,url:r.url,host:r.host,status:r.status_code,status_code:r.status_code,duration_ms:r.duration_ms,size_bytes:r.size_bytes,time:`${r.duration_ms}ms`,size:f(r.size_bytes),timestamp:r.captured_at?new Date(r.captured_at).getTime():Date.now(),captured_at:r.captured_at,is_https:r.is_https,protocol:r.is_https?'HTTPS/1.1':'HTTP/1.1',reqHeaders:r.req_headers||{},reqBody:r.req_body,resHeaders:r.res_headers||{},resBody:r.res_body}}
function f(b){if(!b||b===0)return'0 B';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}

// =============================================
// WebSocket
// =============================================
function connectWebSocket(){if(ws&&ws.readyState===WebSocket.OPEN)return;const p=location.protocol==='https:'?'wss:':'ws:';try{ws=new WebSocket(`${p}//${location.host}/ws`);ws.onopen=()=>{if(wsReconnectTimer){clearTimeout(wsReconnectTimer);wsReconnectTimer=null}};ws.onmessage=(e)=>{try{const m=JSON.parse(e.data);if(m.type==='new_request'&&m.data){requests.unshift(n(m.data));renderRequestList()}}catch{}};ws.onclose=()=>{wsReconnectTimer=setTimeout(connectWebSocket,3000)};ws.onerror=()=>ws.close()}catch{wsReconnectTimer=setTimeout(connectWebSocket,3000)}}

// =============================================
// Rendering
// =============================================
function renderRequestList(){const list=document.getElementById('requestList');let filtered=requests.filter(r=>{if(currentFilter!=='all'&&r.method!==currentFilter)return false;if(errorFilterOnly&&r.status<400)return false;const q=document.getElementById('searchInput').value.toLowerCase();if(q){return r.url.toLowerCase().includes(q)||r.method.toLowerCase().includes(q)||String(r.status).includes(q)}return true});
if(filtered.length===0){list.innerHTML=`<div style="padding:32px 16px;text-align:center;color:var(--text-tertiary);font-size:13px">${t('no_requests')}</div>`}else{list.innerHTML=filtered.map(r=>{const sc=`status-${Math.floor(r.status/100)}xx`;const ts=r.captured_at?new Date(r.captured_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';return`<div class="request-item ${selectedRequestId===r.id?'active':''}" onclick="selectRequest(${r.id})"><span class="method-badge method-${r.method}">${r.method}</span><span class="status-code ${sc}">${r.status}</span><div class="request-info"><span class="request-url">${e(r.url)}</span><div class="request-meta"><span>${e(r.host)}</span><span>${ts}</span><span>${r.size}</span></div></div><span class="request-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></span></div>`}).join('')}
document.getElementById('requestCount').textContent=`${requests.length} ${t('recordings')}`;loadStats()}

async function selectRequest(id){selectedRequestId=id;let r=requests.find(r=>r.id===id);if(!r||!r.reqHeaders||Object.keys(r.reqHeaders).length===0){const d=await loadRequestDetail(id);if(d){r=n(d);const idx=requests.findIndex(x=>x.id===id);if(idx>=0)requests[idx]=r}}if(!r)return;
document.getElementById('detailEmpty').style.display='none';document.getElementById('detailContent').style.display='flex';
document.getElementById('req-url').textContent=r.url||'';document.getElementById('req-method').textContent=r.method||'';document.getElementById('req-host').textContent=r.host||'';document.getElementById('req-protocol').textContent=r.protocol||'';
const rh=r.reqHeaders||{};document.getElementById('req-headers-content').textContent=Object.keys(rh).length>0?Object.entries(rh).map(([k,v])=>`${k}: ${v}`).join('\n'):t('empty');
document.getElementById('req-body-content').textContent=r.reqBody||t('empty');
const sc=`status-${Math.floor(r.status/100)}xx`;document.getElementById('res-status').innerHTML=`<span class="status-code ${sc}">${r.status}</span>`;document.getElementById('res-time').textContent=r.time||`${r.duration_ms||0}ms`;document.getElementById('res-size').textContent=r.size||'0 B';
const rsh=r.resHeaders||{};document.getElementById('res-headers-content').textContent=Object.keys(rsh).length>0?Object.entries(rsh).map(([k,v])=>`${k}: ${v}`).join('\n'):t('empty');
document.getElementById('res-body-content').textContent=r.resBody||t('empty');
document.getElementById('resendMethod').value=r.method||'GET';document.getElementById('resendUrl').value=r.url||'';document.getElementById('resendBody').value=r.reqBody||'';
const hc=document.getElementById('resendHeaders');hc.innerHTML='';
if(rh&&Object.keys(rh).length>0){Object.entries(rh).forEach(([k,v])=>addHeaderRow(k,v))}else{addHeaderRow('Host',r.host||'')}
switchTab('request');renderRequestList()}

function switchTab(tab){activeTab=tab;document.querySelectorAll('.detail-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));document.querySelector(`.detail-tab[data-tab="${tab}"]`).classList.add('active');document.getElementById(`tab-${tab}`).classList.add('active');if(tab==='apimap')loadAPIMapHosts()}

// =============================================
// Resend
// =============================================
function addHeaderRow(k='',v=''){const c=document.getElementById('resendHeaders');const row=document.createElement('div');row.className='kv-editor-row';row.innerHTML=`<input type="text" placeholder="Header name" value="${ea(k)}" class="header-key" style="max-width:200px"><input type="text" placeholder="Header value" value="${ea(v)}" class="header-value"><button class="kv-remove-btn" onclick="this.parentElement.remove()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;c.appendChild(row)}
async function sendResend(){const method=document.getElementById('resendMethod').value;const url=document.getElementById('resendUrl').value;const body=document.getElementById('resendBody').value;const hrs=document.querySelectorAll('#resendHeaders .kv-editor-row');const headers={};hrs.forEach(r=>{const k=r.querySelector('.header-key').value.trim();const v=r.querySelector('.header-value').value.trim();if(k)headers[k]=v});if(!url){showToast('error','URL required');return}
const btn=document.getElementById('resendBtn');btn.classList.add('sending');btn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>...`;
try{const result=await apiPost('/api/resend',{method,url,headers,body});requestDetailCache={};await loadRequests();if(result&&result.id)selectRequest(result.id);showToast('success',`${t('sent')} — ${result.status_code} (${result.duration_ms}ms)`)}catch(err){showToast('error',t('send_failed')+': '+err.message)}finally{btn.classList.remove('sending');btn.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> ${t('send')}`}}

// =============================================
// API Map
// =============================================
async function loadAPIMapHosts(){try{const hosts=await apiGet('/api/apimap/hosts');const sel=document.getElementById('apimapHostSelect');sel.innerHTML=`<option value="">${t('select_host')}</option>`+hosts.map(h=>`<option value="${e(h)}">${e(h)}</option>`).join('');if(hosts.length>0){sel.value=hosts[0];loadAPIMap()}}catch(e){}}
async function loadAPIMap(){const host=document.getElementById('apimapHostSelect').value;if(!host)return;try{const tree=await apiGet('/api/apimap?host='+encodeURIComponent(host));renderAPIMapTree(tree)}catch(e){}}
function renderAPIMapTree(node){const container=document.getElementById('apimapTree');container.innerHTML=node?renderTreeNode(node,0):'<div style="padding:16px;color:var(--text-tertiary);font-size:12px">No data</div>'}
function renderTreeNode(node,depth){if(!node.children||node.children.length===0&&!node.isLeaf){return`<div class="tree-node"><div class="tree-node-header" style="padding-left:${depth*20}px"><span class="tree-node-name">${e(node.name)}</span><span class="tree-node-count">0</span></div></div>`}
let html='';node.children.forEach(child=>{if(child.isLeaf){html+=renderLeaf(child,depth+1)}else{const hasChildren=child.children&&child.children.length>0;html+=`<div class="tree-node"><div class="tree-node-header" style="padding-left:${depth*20}px" onclick="toggleTreeNode(this)"><span class="tree-node-toggle ${hasChildren?'open':''}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;color:var(--yellow)"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span class="tree-node-name">${e(child.Name)}</span><span class="tree-node-count">${child.Count||0}</span><div class="tree-node-methods">${(child.Methods||[]).map(m=>`<span class="tree-method-tag method-${m}">${m}</span>`).join('')}</div></div><div class="tree-node-children">${child.children?renderTreeNode(child,depth+1):''}</div></div>`}});return html}
function renderLeaf(node,depth){const statuses=node.Statuses||{};const statusHtml=Object.entries(statuses).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([s,c])=>{const cls=`status-${Math.floor(parseInt(s)/100)}xx`;return`<span class="${cls}">${s}(${c})</span>`}).join('');
return`<div class="tree-node"><div class="tree-leaf-row" style="padding-left:${depth*20}px" onclick="editAPINote('${e(node.FullPath)}','${(node.Methods||['GET'])[0]}','${e(node.Note||'')}',${node.NoteID||0})"><span class="tree-leaf-method method-${(node.Methods||['GET'])[0]}">${(node.Methods||['GET'])[0]}</span><span class="tree-leaf-path">${e(node.FullPath)}</span><span class="tree-leaf-status">${statusHtml}</span>${node.Note?`<span class="tree-leaf-note" title="${e(node.Note)}">${e(node.Note)}</span>`:''}</div></div>`}
function toggleTreeNode(el){el.querySelector('.tree-node-toggle').classList.toggle('open');const children=el.nextElementSibling;if(children){children.style.maxHeight=children.style.maxHeight==='0px'||!children.style.maxHeight?children.scrollHeight+'px':'0px'}}
async function editAPINote(path,method,note,noteId){const host=document.getElementById('apimapHostSelect').value;const newNote=prompt(`备注: ${path} [${method}]`,note);if(newNote===null)return;try{await apiPost('/api/apimap/notes',{host,path,method,note:newNote});loadAPIMap();showToast('success','Note saved')}catch(e){showToast('error','Failed to save note')}}

// =============================================
// Controls
// =============================================
function toggleCapture(){isRecording=!isRecording;const btn=document.getElementById('captureBtn'),label=document.getElementById('captureLabel'),dot=document.getElementById('statusDot'),text=document.getElementById('statusText');
if(isRecording){btn.classList.add('recording');label.textContent=t('recording');dot.classList.add('recording');text.textContent=t('recording')}else{btn.classList.remove('recording');label.textContent=t('paused');dot.classList.remove('recording');text.textContent=t('paused')}}
function setFilter(btn,f){currentFilter=f;document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));btn.classList.add('active');loadRequests()}
function toggleErrorFilter(){errorFilterOnly=!errorFilterOnly;const btn=document.getElementById('errorFilterBtn');if(errorFilterOnly){btn.style.background='var(--red-muted)';btn.style.color='var(--red)';btn.classList.add('active')}else{btn.style.background='transparent';btn.style.color='var(--text-secondary)';btn.classList.remove('active')}loadRequests()}
function filterRequests(){loadRequests()}
async function clearHistory(){if(!confirm(t('confirm_clear')))return;try{await apiPost('/api/clear',{});requests=[];requestDetailCache={};selectedRequestId=null;document.getElementById('detailEmpty').style.display='flex';document.getElementById('detailContent').style.display='none';renderRequestList();showToast('success',t('cleared'))}catch(e){showToast('error',t('send_failed')+': '+e.message)}}

// =============================================
// Utilities
// =============================================
function e(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function ea(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function copyToClipboard(cid){const el=document.getElementById(cid);const text=el.querySelector('pre').textContent;navigator.clipboard.writeText(text).then(()=>showToast('success',t('copied'))).catch(()=>showToast('error','Copy failed'))}
function showToast(type,msg){const c=document.getElementById('toastContainer');const toast=document.createElement('div');toast.className=`toast ${type}`;toast.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${type==='success'?'<polyline points="20 6 9 17 4 12"/>':'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'}</svg>${msg}`;c.appendChild(toast);setTimeout(()=>{toast.style.opacity='0';toast.style.transition='opacity .2s'},2200);setTimeout(()=>toast.remove(),2500)}

// =============================================
// Resize
// =============================================
(function(){const h=document.getElementById('resizeHandle'),p=document.getElementById('requestPanel');let sx,sw;h.addEventListener('mousedown',(ev)=>{sx=ev.clientX;sw=p.offsetWidth;h.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none';const onM=(e)=>{const d=e.clientX-sx;const nw=Math.max(220,Math.min(600,sw+d));p.style.width=nw+'px'};const onU=()=>{h.classList.remove('dragging');document.body.style.cursor='';document.body.style.userSelect='';document.removeEventListener('mousemove',onM);document.removeEventListener('mouseup',onU)};document.addEventListener('mousemove',onM);document.addEventListener('mouseup',onU)})})()

// =============================================
// Init
// =============================================
(async function init(){applyLang();await loadRequests();connectWebSocket();setTimeout(()=>{if(requests.length>0&&!selectedRequestId)selectRequest(requests[0].id)},400)})()

// Keyboard
document.addEventListener('keydown',(e)=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('searchInput').focus()}if((e.metaKey||e.ctrlKey)&&e.key==='f'&&document.activeElement!==document.getElementById('searchInput')){e.preventDefault();document.getElementById('searchInput').focus()}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&activeTab==='resend'){e.preventDefault();sendResend()}if((e.metaKey||e.ctrlKey)&&e.key==='1'){e.preventDefault();switchTab('request')}if((e.metaKey||e.ctrlKey)&&e.key==='2'){e.preventDefault();switchTab('response')}if((e.metaKey||e.ctrlKey)&&e.key==='3'){e.preventDefault();switchTab('resend')}if((e.metaKey||e.ctrlKey)&&e.key==='4'){e.preventDefault();switchTab('apimap')}})
</script>
</body>
