name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cgo_enabled: 1
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cgo_enabled: 0
          - goos: darwin
            goarch: amd64
            runner: macos-13
            cgo_enabled: 1
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            cgo_enabled: 1
          - goos: windows
            goarch: amd64
            runner: windows-latest
            cgo_enabled: 0
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libpcap-dev (Linux)
        if: matrix.goos == 'linux' && matrix.cgo_enabled == 1
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; else EXT=""; fi
          cd cmd/proxy
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "../../packetlab-${GOOS}-${GOARCH}${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packetlab-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packetlab-${{ matrix.goos }}-${{ matrix.goarch }}*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ -f CHANGELOG.md ]; then
            awk "/^## ${VERSION} /{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > /tmp/release_body.md
          fi
          if [ ! -s /tmp/release_body.md ]; then
            git tag -l --format='%(contents)' "${VERSION}" > /tmp/release_body.md
          fi
          if [ ! -s /tmp/release_body.md ]; then
            echo "See [commits](https://github.com/${GITHUB_REPOSITORY}/commits/${VERSION}) for details." > /tmp/release_body.md
          fi
          cat /tmp/release_body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum packetlab-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.changelog.outputs.version }}
          body_path: /tmp/release_body.md
          files: dist/*
          draft: false
          prerelease: false
