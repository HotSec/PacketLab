name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cgo_enabled: 1
            cc: gcc
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cgo_enabled: 1
            cc: aarch64-linux-gnu-gcc
            cross: true
          - goos: darwin
            goarch: amd64
            runner: macos-13
            cgo_enabled: 1
            cc: clang
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            cgo_enabled: 1
            cc: clang
          - goos: windows
            goarch: amd64
            runner: windows-latest
            cgo_enabled: 0
            cc: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libpcap-dev (Linux amd64)
        if: matrix.goos == 'linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install cross-compile toolchain (Linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # Build libpcap for arm64 from source
          git clone https://github.com/the-tcpdump-group/libpcap.git /tmp/libpcap
          cd /tmp/libpcap
          CC=aarch64-linux-gnu-gcc ./configure --host=aarch64-linux-gnu --prefix=/usr/aarch64-linux-gnu --disable-shared --disable-dbus --disable-rdma
          make -j$(nproc)
          sudo make install

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          CC: ${{ matrix.cc }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; else EXT=""; fi

          EXTRA_FLAGS=""
          if [ "${{ matrix.cross }}" = "true" ]; then
            EXTRA_FLAGS="-extldflags=-L/usr/aarch64-linux-gnu/lib"
          fi

          cd cmd/proxy
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} ${EXTRA_FLAGS}" \
            -o "../../packetlab-${GOOS}-${GOARCH}${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packetlab-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packetlab-${{ matrix.goos }}-${{ matrix.goarch }}*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ -f CHANGELOG.md ]; then
            awk "/^## ${VERSION} /{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > /tmp/release_body.md
          fi
          if [ ! -s /tmp/release_body.md ]; then
            git tag -l --format='%(contents)' "${VERSION}" > /tmp/release_body.md
          fi
          if [ ! -s /tmp/release_body.md ]; then
            echo "See [commits](https://github.com/${GITHUB_REPOSITORY}/commits/${VERSION}) for details." > /tmp/release_body.md
          fi
          cat /tmp/release_body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum packetlab-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.changelog.outputs.version }}
          body_path: /tmp/release_body.md
          files: dist/*
          draft: false
          prerelease: false
